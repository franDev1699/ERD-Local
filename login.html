<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - Gnome ERD</title>
  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    if (!window.lucide) {
      document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.395.0/umd/lucide.min.js"><\/script>');
    }
  </script>
  
  <style>
    :root {
      --color-bg: #090d16;
      --color-card: #0f172a;
      --color-border: #334155;
      --color-border-focus: #6366f1;
      --color-primary: #6366f1;
      --color-primary-hover: #4f46e5;
      --color-text-main: #f8fafc;
      --color-text-muted: #94a3b8;
      --color-danger: #ef4444;
      --color-danger-bg: rgba(239, 68, 68, 0.1);
      --font-sans: 'Inter', sans-serif;
      --font-display: 'Outfit', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--color-bg);
      color: var(--color-text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Ambient background glow */
    .glow-bg {
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(99, 102, 241, 0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: -1;
      pointer-events: none;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }

    .card {
      background-color: var(--color-card);
      border: 1px solid var(--color-border);
      border-radius: 16px;
      padding: 35px 30px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    .logo-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 25px;
    }

    .logo-img {
      width: 60px;
      height: 60px;
      object-fit: contain;
      margin-bottom: 12px;
    }

    .app-title {
      font-family: var(--font-display);
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--color-text-main);
      letter-spacing: -0.5px;
    }

    .app-title span {
      color: var(--color-primary);
    }

    .app-subtitle {
      font-size: 0.9rem;
      color: var(--color-text-muted);
      margin-top: 4px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--color-text-muted);
      margin-bottom: 6px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--color-text-muted);
      width: 16px;
      height: 16px;
    }

    .form-control {
      width: 100%;
      background-color: rgba(9, 13, 22, 0.6);
      border: 1px solid var(--color-border);
      border-radius: 8px;
      padding: 10px 12px 10px 38px;
      color: var(--color-text-main);
      font-family: var(--font-sans);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }

    .form-control:focus {
      border-color: var(--color-border-focus);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
      background-color: rgba(9, 13, 22, 0.8);
    }

    /* Color picker dots style */
    .color-picker-label {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--color-text-muted);
      margin-bottom: 8px;
      display: block;
    }

    .color-options {
      display: flex;
      gap: 10px;
      margin-bottom: 5px;
    }

    .color-dot {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.15s ease, border-color 0.15s;
    }

    .color-dot:hover {
      transform: scale(1.15);
    }

    .color-dot.selected {
      border-color: var(--color-text-main);
      transform: scale(1.1);
    }

    .btn-submit {
      width: 100%;
      background-color: var(--color-primary);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: background-color 0.2s;
      margin-top: 10px;
    }

    .btn-submit:hover {
      background-color: var(--color-primary-hover);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .toggle-text {
      text-align: center;
      font-size: 0.85rem;
      color: var(--color-text-muted);
      margin-top: 20px;
    }

    .toggle-link {
      color: var(--color-primary);
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
    }

    .toggle-link:hover {
      text-decoration: underline;
    }

    .error-alert {
      background-color: var(--color-danger-bg);
      border: 1px solid var(--color-danger);
      color: #fca5a5;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 20px;
      display: none;
      align-items: center;
      gap: 8px;
    }

    .hidden {
      display: none !important;
    }

    /* Loading Spinner */
    .spinner {
      border: 2.5px solid rgba(255, 255, 255, 0.3);
      border-top: 2.5px solid white;
      border-radius: 50%;
      width: 16px;
      height: 16px;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .password-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--color-text-muted);
      cursor: pointer;
      background: transparent;
      border: none;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s ease;
    }
    .password-toggle:hover {
      color: var(--color-text-main);
    }
    .form-control[type="password"] {
      padding-right: 38px;
    }
  </style>
</head>
<body>
  <div class="glow-bg"></div>
  <div class="container">
    <div class="card">
      <div class="logo-container">
        <img src="assets/imgs/gnomo-logo.png" class="logo-img" alt="Gnome ERD logo" onerror="this.src='https://raw.githubusercontent.com/lucide-icons/lucide/main/icons/database.svg'">
        <h1 class="app-title">Gnome <span>ERD</span></h1>
        <p class="app-subtitle" id="subtitle-text">Diseño de diagramas colaborativo</p>
      </div>

      <div class="error-alert" id="error-alert">
        <i data-lucide="alert-circle" style="width: 16px; height: 16px; flex-shrink: 0;"></i>
        <span id="error-message">Error message here</span>
      </div>

      <!-- LOGIN FORM -->
      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-username">Usuario</label>
          <div class="input-wrapper">
            <i data-lucide="user" class="input-icon"></i>
            <input type="text" id="login-username" class="form-control" placeholder="Nombre de usuario" required autocomplete="username">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="login-password">Contraseña</label>
          <div class="input-wrapper">
            <i data-lucide="lock" class="input-icon"></i>
            <input type="password" id="login-password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
            <button type="button" class="password-toggle" id="btn-toggle-login-password" title="Mostrar contraseña">
              <i data-lucide="eye" style="width: 16px; height: 16px;"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="btn-submit" id="btn-login-submit">
          <span>Ingresar</span>
          <i data-lucide="log-in" style="width: 16px; height: 16px;"></i>
        </button>
      </form>

      <!-- REGISTER FORM -->
      <form id="register-form" class="hidden">
        <div class="form-group">
          <label class="form-label" for="reg-username">Nombre de Usuario</label>
          <div class="input-wrapper">
            <i data-lucide="user" class="input-icon"></i>
            <input type="text" id="reg-username" class="form-control" placeholder="ej: francisco" required autocomplete="username">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-displayname">Nombre Visible</label>
          <div class="input-wrapper">
            <i data-lucide="tag" class="input-icon"></i>
            <input type="text" id="reg-displayname" class="form-control" placeholder="ej: Francisco Pérez" required>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-password">Contraseña</label>
          <div class="input-wrapper">
            <i data-lucide="lock" class="input-icon"></i>
            <input type="password" id="reg-password" class="form-control" placeholder="••••••••" required autocomplete="new-password">
            <button type="button" class="password-toggle" id="btn-toggle-reg-password" title="Mostrar contraseña">
              <i data-lucide="eye" style="width: 16px; height: 16px;"></i>
            </button>
          </div>
        </div>
        <div class="form-group">
          <span class="color-picker-label">Color de Colaborador</span>
          <div class="color-options" id="register-color-options">
            <div class="color-dot selected" style="background-color: #6366f1;" data-color="#6366f1"></div>
            <div class="color-dot" style="background-color: #10b981;" data-color="#10b981"></div>
            <div class="color-dot" style="background-color: #3b82f6;" data-color="#3b82f6"></div>
            <div class="color-dot" style="background-color: #ef4444;" data-color="#ef4444"></div>
            <div class="color-dot" style="background-color: #f59e0b;" data-color="#f59e0b"></div>
            <div class="color-dot" style="background-color: #ec4899;" data-color="#ec4899"></div>
            <div class="color-dot" style="background-color: #06b6d4;" data-color="#06b6d4"></div>
          </div>
        </div>
        <button type="submit" class="btn-submit" id="btn-register-submit">
          <span>Registrarse e Iniciar</span>
          <i data-lucide="user-plus" style="width: 16px; height: 16px;"></i>
        </button>
      </form>

      <div class="toggle-text" id="toggle-container">
        ¿No tienes cuenta? <a class="toggle-link" id="link-to-register">Regístrate aquí</a>
      </div>
    </div>
  </div>

  <script>
    // Initialize Lucide Icons
    lucide.createIcons();

    // Password visibility toggle helpers
    function setupPasswordToggle(inputId, toggleId) {
      const input = document.getElementById(inputId);
      const toggle = document.getElementById(toggleId);
      if (!input || !toggle) return;
      toggle.addEventListener('click', () => {
        const isPassword = input.type === 'password';
        input.type = isPassword ? 'text' : 'password';
        
        toggle.innerHTML = isPassword 
          ? `<i data-lucide="eye-off" style="width: 16px; height: 16px;"></i>`
          : `<i data-lucide="eye" style="width: 16px; height: 16px;"></i>`;
        
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });
    }

    setupPasswordToggle('login-password', 'btn-toggle-login-password');
    setupPasswordToggle('reg-password', 'btn-toggle-reg-password');

    const errorAlert = document.getElementById('error-alert');
    const errorMessage = document.getElementById('error-message');
    const loginForm = document.getElementById('login-form');
    const registerForm = document.getElementById('register-form');
    const subtitleText = document.getElementById('subtitle-text');
    const toggleContainer = document.getElementById('toggle-container');
    const linkToRegister = document.getElementById('link-to-register');

    let selectedColor = '#6366f1';
    let isRegisterMode = false;

    // Color Selector
    const colorDots = document.querySelectorAll('.color-dot');
    colorDots.forEach(dot => {
      dot.addEventListener('click', () => {
        colorDots.forEach(d => d.classList.remove('selected'));
        dot.classList.add('selected');
        selectedColor = dot.getAttribute('data-color');
      });
    });

    // Toggle Modes
    function showRegister() {
      isRegisterMode = true;
      loginForm.classList.add('hidden');
      registerForm.classList.remove('hidden');
      subtitleText.textContent = 'Crea tu cuenta de colaborador';
      toggleContainer.innerHTML = '¿Ya tienes cuenta? <a class="toggle-link" id="link-to-login">Inicia sesión</a>';
      document.getElementById('link-to-login').addEventListener('click', showLogin);
      errorAlert.style.display = 'none';
    }

    function showLogin() {
      isRegisterMode = false;
      registerForm.classList.add('hidden');
      loginForm.classList.remove('hidden');
      subtitleText.textContent = 'Diseño de diagramas colaborativo';
      toggleContainer.innerHTML = '¿No tienes cuenta? <a class="toggle-link" id="link-to-register">Regístrate aquí</a>';
      document.getElementById('link-to-register').addEventListener('click', showRegister);
      errorAlert.style.display = 'none';
    }

    linkToRegister.addEventListener('click', showRegister);

    function showError(msg) {
      errorMessage.textContent = msg;
      errorAlert.style.display = 'flex';
    }

    // Handle Login
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorAlert.style.display = 'none';
      
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;
      const btn = document.getElementById('btn-login-submit');
      const originalText = btn.innerHTML;

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>';

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const result = await response.json();
        
        if (response.ok && result.success) {
          // Reload page to let server load index.html (since session is now set in cookie)
          window.location.reload();
        } else {
          showError(result.error || 'Nombre de usuario o contraseña incorrectos.');
        }
      } catch (err) {
        showError('No se pudo conectar con el servidor.');
      } finally {
        btn.disabled = false;
        btn.innerHTML = originalText;
        lucide.createIcons();
      }
    });

    // Handle Registration
    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorAlert.style.display = 'none';

      const username = document.getElementById('reg-username').value.trim();
      const displayName = document.getElementById('reg-displayname').value.trim();
      const password = document.getElementById('reg-password').value;
      const btn = document.getElementById('btn-register-submit');
      const originalText = btn.innerHTML;

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>';

      try {
        const response = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, displayName, password, color: selectedColor })
        });
        const result = await response.json();

        if (response.ok && result.success) {
          window.location.reload();
        } else {
          showError(result.error || 'Error al registrar el usuario.');
        }
      } catch (err) {
        showError('No se pudo conectar con el servidor.');
      } finally {
        btn.disabled = false;
        btn.innerHTML = originalText;
        lucide.createIcons();
      }
    });
  </script>
</body>
</html>
